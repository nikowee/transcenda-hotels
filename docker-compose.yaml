services:
  # Node/Express API Proxy Server
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
      # The dev stage: full dependencies (tsx included) so the watcher command
      # below works. Plain `docker build` without a target produces the
      # production runtime stage instead.
      target: dev
    ports:
      - "5000:5000"            # Maps your local desktop port 5000 directly to container port 5000
    volumes:
      - ./server:/app          # Bind Mount: Dynamically pipes local server file changes for hot-reloading
      - /app/node_modules      # Anonymous Volume: Shuts out local OS path drifts from corrupting libraries
    command: npx tsx watch src/index.ts       # Automatically triggers our backend 'tsx watch' automation script
    depends_on:
      - redis
    env_file:
      - ./server/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - RATE_LIMIT_RELAXED=${RATE_LIMIT_RELAXED:-false}

  # React UI Interface Frame
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"            # Maps your local desktop port 3000 directly to container port 3000
    volumes:
      - ./client:/app          # Bind Mount: Pipes code updates instantly for hot-reloading
      - /app/node_modules      # Anonymous Volume: Shuts out local OS path drifts from corrupting libraries
    command: npm run dev       # Triggers Vite SWC compiler development runtime loops
    depends_on:
      - backend                # Structural Ordering Enforcer: Won't let the UI execute until the API boots
    env_file:
      - ./client/.env

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data  # Persist cache data across restarts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data: