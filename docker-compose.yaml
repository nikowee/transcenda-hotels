services:
  # Node/Express API Proxy Server
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"            # Maps your local desktop port 5000 directly to container port 5000
    volumes:
      - ./server:/app          # Bind Mount: Dynamically pipes local server file changes for hot-reloading
      - /app/node_modules      # Anonymous Volume: Shuts out local OS path drifts from corrupting libraries
    command: npm run dev       # Automatically triggers our backend 'tsx watch' automation script
    env_file:
    - ./server/.env

  # React UI Interface Frame
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"            # Maps your local desktop port 3000 directly to container port 3000
    volumes:
      - ./client:/app          # Bind Mount: Pipes code updates instantly for hot-reloading
      - /app/node_modules      # Anonymous Volume: Shuts out local OS path drifts from corrupting libraries
    command: npm run dev       # Triggers Vite SWC compiler development runtime loops
    depends_on:
      - backend                # Structural Ordering Enforcer: Won't let the UI execute until the API boots