# Serves the built SPA. The one non-default behaviour that matters is the
# fallback: /checkout, /payment and every other client route are files that do
# not exist on disk — they must all answer with index.html so the router can
# take over. Without try_files, a refresh on any deep link is a 404.
server {
    listen 3000;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets are immutable by construction — the name changes when the
    # content does, so a year-long cache can never serve a stale file.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html itself must never be cached hard: it is the pointer to the
    # current asset hashes, and a cached copy pins users to a dead deploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}